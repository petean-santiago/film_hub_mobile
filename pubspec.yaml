name: film_hub
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1
  dio: ^5.4.1
  json_annotation: ^4.9.0
  flutter_gen_runner: ^5.12.0
  google_fonts: ^6.3.2
  font_awesome_flutter: ^10.12.0
  carousel_slider: ^5.1.1
  flutter_dotenv: ^6.0.0
  youtube_player_flutter: ^9.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.7.1
  json_serializable: ^6.7.1

flutter_gen:
  output: lib/gen/
  line_length: 80

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/env/